name: Open Cookie Size Audit

on:
  workflow_dispatch:

jobs:
  size-audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libudev-dev

      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0

      - name: Verify Rust
        shell: bash
        run: |
          set -euo pipefail

          rustc --version
          cargo --version

      - name: Install Solana 2.3.0
        shell: bash
        run: |
          set -euo pipefail

          sh -c "$(curl -sSfL https://release.anza.xyz/v2.3.0/install)"

          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"

          export PATH="$SOLANA_BIN:$PATH"
          echo "$SOLANA_BIN" >> "$GITHUB_PATH"

          echo "Solana:"
          solana --version

          echo "SBF build tool:"
          cargo build-sbf --version

      - name: Install Anchor CLI 0.32.1
        shell: bash
        run: |
          set -euo pipefail

          cargo install \
            --git https://github.com/solana-foundation/anchor \
            --tag v0.32.1 \
            anchor-cli \
            --locked

          echo "Anchor:"
          anchor --version

      - name: Verify project versions
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Toolchain ==="
          rustc --version
          solana --version
          anchor --version

          echo ""
          echo "=== Project ==="
          grep 'anchor-lang' programs/open-cookie/Cargo.toml
          grep 'solana-sha256-hasher' programs/open-cookie/Cargo.toml

      - name: Build and measure variants
        shell: bash
        run: |
          set -euo pipefail

          PROGRAM="target/deploy/open_cookie.so"

          measure() {
            local label="$1"
            local bytes

            if [ ! -f "$PROGRAM" ]; then
              echo "ERROR: $PROGRAM was not produced."
              exit 1
            fi

            bytes=$(stat -c%s "$PROGRAM")

            echo ""
            echo "=========================================="
            echo "$label"
            echo "=========================================="
            echo "Size: $bytes bytes"
            echo "Size: $(awk "BEGIN {printf \"%.2f\", $bytes/1024}") KiB"

            echo ""
            echo "Solana rent:"
            solana rent "$bytes" || true
          }

          echo ""
          echo "=========================================="
          echo "1. BASELINE"
          echo "=========================================="

          anchor clean
          anchor build

          cp "$PROGRAM" /tmp/open_cookie_baseline.so

          measure "BASELINE"

          echo ""
          echo "=========================================="
          echo "2. NO-IDL"
          echo "=========================================="

          anchor clean
          anchor build -- --features no-idl

          cp "$PROGRAM" /tmp/open_cookie_no_idl.so

          measure "NO-IDL"

          echo ""
          echo "=========================================="
          echo "3. NO-IDL + NO-LOG-IX-NAME"
          echo "=========================================="

          anchor clean
          anchor build -- --features no-idl,no-log-ix-name

          cp "$PROGRAM" /tmp/open_cookie_no_idl_no_log.so

          measure "NO-IDL + NO-LOG-IX-NAME"

          echo ""
          echo "=========================================="
          echo "FINAL SIZE COMPARISON"
          echo "=========================================="

          python3 <<'PY'
          import os

          files = {
              "Baseline": "/tmp/open_cookie_baseline.so",
              "no-idl": "/tmp/open_cookie_no_idl.so",
              "no-idl + no-log-ix-name": "/tmp/open_cookie_no_idl_no_log.so",
          }

          sizes = {
              name: os.path.getsize(path)
              for name, path in files.items()
          }

          baseline = sizes["Baseline"]

          print()
          print(
              f"{'Configuration':30} "
              f"{'Bytes':>12} "
              f"{'Saved':>12} "
              f"{'Reduction':>12}"
          )
          print("-" * 72)

          for name, size in sizes.items():
              saved = baseline - size
              reduction = saved / baseline * 100

              print(
                  f"{name:30} "
                  f"{size:12,} "
                  f"{saved:12,} "
                  f"{reduction:11.2f}%"
              )

          print()
          print("No program was deployed.")
          print("Only local SBF binaries were built and measured.")
          PY

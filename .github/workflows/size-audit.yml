name: Open Cookie Size Audit

on:
  workflow_dispatch:

jobs:
  size-audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libudev-dev

      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Verify host Rust toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "PATH=$PATH"
          echo "cargo:"
          which cargo
          cargo --version

          echo "rustc:"
          which rustc
          rustc --version

          echo "rustup:"
          rustup --version

      - name: Install Solana 2.3.0
        shell: bash
        run: |
          set -euo pipefail

          sh -c "$(curl -sSfL https://release.anza.xyz/v2.3.0/install)"

          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"

          # IMPORTANT:
          # Do NOT prepend the Solana directory to PATH here.
          # Its bundled tooling contains an older Cargo.
          #
          # We only expose Solana executables to future steps
          # through GITHUB_PATH, after the normal Rust toolchain.

          echo "$SOLANA_BIN" >> "$GITHUB_PATH"

          export PATH="$HOME/.cargo/bin:$SOLANA_BIN:$PATH"

          echo "=== Solana ==="
          "$SOLANA_BIN/solana" --version

          echo ""
          echo "=== Host Cargo ==="
          which cargo
          cargo --version

          echo ""
          echo "=== Host Rust ==="
          which rustc
          rustc --version

          echo ""
          echo "=== SBF builder ==="
          "$SOLANA_BIN/cargo-build-sbf" --version
      - name: DEBUG after Solana
        shell: bash
        run: |
          set -eux

          echo "=== PATH ==="
          echo "$PATH"

          echo "=== CARGO ==="
          which cargo
          cargo --version

          echo "=== RUSTC ==="
          which rustc
          rustc --version

          echo "=== RUSTUP ==="
          rustup which cargo
          rustup which rustc

          echo "=== CARGO BIN ==="
          ls -l "$HOME/.cargo/bin/cargo"
          ls -l "$HOME/.cargo/bin/rustc"

          echo "=== SOLANA BIN ==="
          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"
          ls -l "$SOLANA_BIN" | grep -E 'cargo|rustc|solana' || true

      - name: Install Anchor CLI 0.32.1
        shell: bash
        run: |
          set -euo pipefail

          # Explicitly restore the host Rust toolchain.
          export PATH="$HOME/.cargo/bin:$PATH"

          echo "Using host Cargo:"
          which cargo
          cargo --version

          echo "Using host Rust:"
          rustc --version

          cargo install \
            --git https://github.com/solana-foundation/anchor \
            --tag v0.32.1 \
            anchor-cli \
            --locked

          echo ""
          echo "Anchor:"
          anchor --version

      - name: Verify complete toolchain
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/.cargo/bin:$PATH"

          echo "=== Rust ==="
          rustc --version
          cargo --version

          echo ""
          echo "=== Solana ==="
          solana --version

          echo ""
          echo "=== Anchor ==="
          anchor --version

          echo ""
          echo "=== Project Anchor version ==="
          grep 'anchor-lang' programs/open-cookie/Cargo.toml

      - name: Build and measure variants
        shell: bash
        run: |
          set -euo pipefail

          PROGRAM="target/deploy/open_cookie.so"

          measure() {
            local label="$1"
            local bytes

            if [ ! -f "$PROGRAM" ]; then
              echo "ERROR: $PROGRAM was not produced."
              exit 1
            fi

            bytes=$(stat -c%s "$PROGRAM")

            echo ""
            echo "=========================================="
            echo "$label"
            echo "=========================================="
            echo "Size: $bytes bytes"
            echo "Size: $(awk "BEGIN {printf \"%.2f\", $bytes/1024}") KiB"

            echo ""
            echo "Solana rent:"
            solana rent "$bytes" || true
          }

          echo ""
          echo "=========================================="
          echo "1. BASELINE"
          echo "=========================================="

          anchor clean
          anchor build

          cp "$PROGRAM" /tmp/open_cookie_baseline.so

          measure "BASELINE"

          echo ""
          echo "=========================================="
          echo "2. NO-IDL"
          echo "=========================================="

          anchor clean
          anchor build -- --features no-idl

          cp "$PROGRAM" /tmp/open_cookie_no_idl.so

          measure "NO-IDL"

          echo ""
          echo "=========================================="
          echo "3. NO-IDL + NO-LOG-IX-NAME"
          echo "=========================================="

          anchor clean
          anchor build -- --features no-idl,no-log-ix-name

          cp "$PROGRAM" /tmp/open_cookie_no_idl_no_log.so

          measure "NO-IDL + NO-LOG-IX-NAME"

          echo ""
          echo "=========================================="
          echo "FINAL SIZE COMPARISON"
          echo "=========================================="

          python3 <<'PY'
          import os

          files = {
              "Baseline": "/tmp/open_cookie_baseline.so",
              "no-idl": "/tmp/open_cookie_no_idl.so",
              "no-idl + no-log-ix-name":
                  "/tmp/open_cookie_no_idl_no_log.so",
          }

          sizes = {
              name: os.path.getsize(path)
              for name, path in files.items()
          }

          baseline = sizes["Baseline"]

          print()
          print(
              f"{'Configuration':30} "
              f"{'Bytes':>12} "
              f"{'Saved':>12} "
              f"{'Reduction':>12}"
          )
          print("-" * 72)

          for name, size in sizes.items():
              saved = baseline - size
              reduction = saved / baseline * 100

              print(
                  f"{name:30} "
                  f"{size:12,} "
                  f"{saved:12,} "
                  f"{reduction:11.2f}%"
              )

          print()
          print("No program was deployed.")
          print("Only local SBF binaries were built and measured.")
          PY
